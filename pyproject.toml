[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolify-ai"
version = "0.1.0"
authors = [
  { name="Moustapha Moussa", email="your.email@example.com" },
]
description = "Turn any Python function into an AI Agent Tool instantly."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
"Homepage" = "https://github.com/moussa/toolify"
"Bug Tracker" = "https://github.com/moussa/toolify/issues"
